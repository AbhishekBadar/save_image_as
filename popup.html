<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 400px;
      max-height: 520px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #1a1a2e;
      background: #f8f9fb;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(135deg, #6C5CE7, #0984E3);
      color: #fff;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
    }

    header .count {
      font-size: 12px;
      opacity: 0.85;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid #e2e6ea;
      background: #fff;
    }

    .toolbar select {
      flex: 0 0 auto;
      padding: 5px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 12px;
      background: #fff;
      cursor: pointer;
    }

    .toolbar .spacer { flex: 1; }

    .toolbar button {
      padding: 5px 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-select {
      background: #eef0f4;
      color: #333;
    }

    .btn-download {
      background: linear-gradient(135deg, #6C5CE7, #0984E3);
      color: #fff;
    }

    .btn-download:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .grid-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .card {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      aspect-ratio: 1;
    }

    .card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card.selected {
      border-color: #6C5CE7;
      box-shadow: 0 0 0 2px rgba(108, 92, 231, 0.25);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card .check {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
      border: 2px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .card.selected .check {
      background: #6C5CE7;
      border-color: #6C5CE7;
    }

    .card.selected .check::after {
      content: "";
      width: 6px;
      height: 10px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    .card .dims {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 2px 6px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 10px;
      text-align: center;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <h1>Save All Images</h1>
    <span class="count" id="count"></span>
  </header>

  <div class="toolbar">
    <select id="format">
      <option value="png">PNG</option>
      <option value="jpg">JPG</option>
      <option value="webp">WebP</option>
    </select>
    <button class="btn-select" id="selectAll">Select All</button>
    <div class="spacer"></div>
    <button class="btn-download" id="download" disabled>Download (0)</button>
  </div>

  <div class="grid-wrap">
    <div id="content" class="loading">Scanning page for images...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
